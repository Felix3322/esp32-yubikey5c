name: "ESP32-S3"

on:
  push:
    branches: [ "main", "librefido/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [ development, standard, hardened ]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-${{ matrix.profile }} -DLIBREFIDO_PROFILE=${{ matrix.profile }} set-target esp32s3
          idf.py -B build-${{ matrix.profile }} -DLIBREFIDO_PROFILE=${{ matrix.profile }} build

      - name: Firmware descriptor
        shell: bash
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools/librefido")
          from librefido import firmware
          d = firmware.parse(open("build-${{ matrix.profile }}/pico_fido2.bin", "rb").read())
          print(d)
          assert d["platform"] == "esp32s3" and d["build_profile"] == "${{ matrix.profile }}"
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: librefido-esp32s3-${{ matrix.profile }}
          path: |
            build-${{ matrix.profile }}/bootloader/bootloader.bin
            build-${{ matrix.profile }}/partition_table/partition-table.bin
            build-${{ matrix.profile }}/ota_data_initial.bin
            build-${{ matrix.profile }}/pico_fido2.bin
            build-${{ matrix.profile }}/flash_args

  emulator-tests:
    name: Emulator tests (${{ matrix.sanitize && 'ASan+UBSan' || 'plain' }})
    strategy:
      fail-fast: false
      matrix:
        sanitize: [ false, true ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pcscd libpcsclite-dev vsmartcard-vpcd swig opensc gnupg scdaemon
          python3 -m venv .venv
          .venv/bin/pip install pytest pyscard fido2 cryptography yubikey-manager reedsolo PySide6

      - name: Build emulators
        run: |
          FLAGS=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then FLAGS="-DCMAKE_C_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"; fi
          cmake -S . -B build-emu -G Ninja -DENABLE_EMULATION=1 $FLAGS && ninja -C build-emu
          cmake -S . -B build-emu-hard -G Ninja -DENABLE_EMULATION=1 -DLIBREFIDO_PROFILE=hardened $FLAGS && ninja -C build-emu-hard

      - name: Tests
        env:
          LF_EMU_BIN: ${{ github.workspace }}/build-emu/pico_fido2
          LF_EMU_BIN_HARDENED: ${{ github.workspace }}/build-emu-hard/pico_fido2
          LF_TEST_SYSTEM_PCSCD: "1"     # pcscd service with the vpcd reader (port 35963)
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
        run: |
          sudo systemctl restart pcscd
          PYTHONPATH=tests:tools/librefido:tests/profiles .venv/bin/python -m pytest -q tests
          PYTHONPATH=tests:pico-fido/tests .venv/bin/python -m pytest -q -p harness.plugin pico-fido/tests/pico-fido
